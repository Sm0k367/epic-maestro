name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety bandit
    
    - name: Run Safety check for known vulnerabilities
      run: |
        echo "Checking for known vulnerabilities in dependencies..."
        safety check --json || true
      continue-on-error: true
    
    - name: Run Bandit security analysis
      run: |
        echo "Running static security analysis..."
        bandit -r core/ api/ -f json -o bandit-report.json || true
    
    - name: Check for hardcoded secrets
      run: |
        echo "Scanning for hardcoded secrets..."
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline || true
      continue-on-error: true
    
    - name: Verify .gitignore is present
      run: |
        if [ ! -f .gitignore ]; then
          echo "ERROR: .gitignore not found!"
          exit 1
        fi
        echo "✓ .gitignore is present and configured"
    
    - name: Check for exposed credentials in code
      run: |
        echo "Checking for exposed credentials patterns..."
        if grep -r "api_key\s*=\s*['\"]" core/ api/ tests/ 2>/dev/null | grep -v "self.config\|environment\|os.environ"; then
          echo "WARNING: Potential hardcoded credentials found"
          exit 1
        fi
        echo "✓ No hardcoded credentials detected"

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Check for outdated dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "Checking for outdated packages..."
        pip list --outdated || echo "All packages are up to date"
    
    - name: Generate SBOM (Software Bill of Materials)
      run: |
        pip install pip-tools cyclonedx-bom
        pip freeze > frozen-requirements.txt
        cyclonedx-bom -o sbom.xml -i frozen-requirements.txt || true
    
    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: sbom
        path: sbom.xml
        retention-days: 30

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{ matrix.language }}"

  tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Run tests with coverage
      run: |
        pip install coverage
        coverage run -m pytest tests/
        coverage report
        coverage xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort
    
    - name: Run Black code formatter check
      run: black --check core/ api/ tests/ || true
    
    - name: Run isort import check
      run: isort --check-only core/ api/ tests/ || true
    
    - name: Run Flake8
      run: flake8 core/ api/ tests/ --max-line-length=120 || true
    
    - name: Run Pylint
      run: pylint core/ api/ --disable=C0111,W0212 || true
      continue-on-error: true

  report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [security, dependency-check, tests]
    if: always()
    
    steps:
    - name: Create security summary
      run: |
        echo "## Security Check Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Dependency security checks completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Secret scanning completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Code quality analysis completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See workflow logs for details" >> $GITHUB_STEP_SUMMARY
